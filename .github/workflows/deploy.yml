# Build check: memastikan proyek bisa dibangun di setiap push dan pull request.
# Deploy dilakukan oleh Cloudflare Pages (proyek "mab-app"), bukan oleh workflow ini.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # versi dibaca dari "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm build