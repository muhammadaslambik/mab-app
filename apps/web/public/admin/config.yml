# ============================================================================
# KONFIGURASI SVELTIA CMS — dibuat otomatis oleh: node scripts/gen-cms-config.mjs
# Jangan edit manual (akan tertimpa). Ubah scripts/gen-cms-config.mjs lalu jalankan ulang.
# ============================================================================
backend:
  name: "github"
  repo: "muhammadaslambik/mab-app"
  branch: "main"
site_url: "https://mab-app.eu.org"
display_url: "https://mab-app.eu.org"
media_folder: "apps/web/public/uploads"
public_folder: "/uploads"
i18n:
  structure: "multiple_files"
  locales: ["en","id","ar","zh","es","fr","ru"]
  default_locale: "en"
collections:
  - name: "apps"
    label: "Aplikasi"
    description: "Daftar aplikasi yang tampil di vault. Urutan di sini = urutan di situs (seret untuk mengubah)."
    files:
      - name: "registry"
        label: "Daftar Aplikasi"
        file: "apps-registry/apps.json"
        format: "json"
        fields:
          - label: "Aplikasi"
            label_singular: "Aplikasi"
            name: "apps"
            widget: "list"
            summary: "{{fields.name}} · {{fields.status}}"
            fields:
              - label: "ID (alamat halaman)"
                name: "id"
                widget: "string"
                pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$","Huruf kecil, angka, dan tanda minus. Contoh: mab-music"]
                hint: "Jadi alamat /app/ID-aplikasi/. Harus unik dan sebaiknya tidak diubah setelah dipublikasikan."
              - label: "Nama"
                name: "name"
                widget: "string"
              - label: "Kategori"
                name: "category"
                widget: "select"
                options:
                  - label: "Aplikasi"
                    value: "application"
                  - label: "Game"
                    value: "game"
                  - label: "Bisnis"
                    value: "business"
                  - label: "Edukasi"
                    value: "education"
              - label: "Platform"
                name: "platform"
                widget: "select"
                multiple: true
                min: 1
                options:
                  - label: "Desktop"
                    value: "desktop"
                  - label: "Mobile (HP)"
                    value: "mobile"
                  - label: "Web"
                    value: "web"
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - label: "Riset (tampil: RESEARCH)"
                    value: "riset"
                  - label: "Beta (tampil: BETA)"
                    value: "beta"
                  - label: "Rilis (tampil: RELEASE)"
                    value: "rilis"
              - label: "Deskripsi singkat"
                name: "description"
                widget: "text"
                pattern: ["^[\\s\\S]{1,160}$","Wajib diisi, maksimal 160 karakter"]
                hint: "Tampil di kartu (maks. 160 karakter)."
              - label: "Ikon"
                name: "icon"
                widget: "select"
                options:
                  - "AppWindow"
                  - "BookOpen"
                  - "Bot"
                  - "Box"
                  - "Brain"
                  - "Briefcase"
                  - "Calculator"
                  - "Camera"
                  - "Cpu"
                  - "Database"
                  - "FlaskConical"
                  - "Gamepad2"
                  - "Gauge"
                  - "Globe"
                  - "GraduationCap"
                  - "Heart"
                  - "Languages"
                  - "Layers"
                  - "LayoutGrid"
                  - "Map"
                  - "MessageSquare"
                  - "Monitor"
                  - "Music"
                  - "Package"
                  - "Palette"
                  - "Puzzle"
                  - "Rocket"
                  - "Shield"
                  - "ShoppingCart"
                  - "Smartphone"
                  - "Sparkles"
                  - "Star"
                  - "Swords"
                  - "Terminal"
                  - "TrendingUp"
                  - "Trophy"
                  - "Wallet"
                  - "Wrench"
                  - "Zap"
                hint: "Nama ikon Lucide. Perlu ikon lain? Tambahkan di packages/ui/src/icons.tsx lalu jalankan node scripts/gen-cms-config.mjs."
              - label: "Tautan aplikasi"
                name: "link"
                widget: "string"
                required: false
                pattern: ["^$|^https?://","Kosongkan, atau awali dengan https://"]
                hint: "Kosongkan jika belum publik (halaman detail menampilkan \"Not public yet\")."
              - label: "Teknologi (tech stack)"
                name: "tech_stack"
                widget: "list"
                required: false
                hint: "Satu teknologi per baris, mis. React, Rust."
              - label: "Deskripsi panjang"
                name: "long_description"
                widget: "text"
                required: false
                hint: "Opsional. Tampil di halaman detail."
              - label: "Tag"
                name: "tags"
                widget: "list"
                required: false
                hint: "Opsional. Membantu pencarian."
              - label: "Unggulan (kartu lebih lebar)"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
              - label: "Terakhir diperbarui"
                name: "updated"
                widget: "string"
                required: false
                pattern: ["^$|^\\d{4}-\\d{2}-\\d{2}$","Format: 2026-10-31"]
                hint: "Format TAHUN-BULAN-TANGGAL, mis. 2026-10-31."
  - name: "settings"
    label: "Pengaturan Situs"
    files:
      - name: "site"
        label: "Info Situs"
        file: "apps-registry/site.json"
        format: "json"
        fields:
          - label: "Nama situs"
            name: "name"
            widget: "string"
            hint: "Dipakai di judul tab, footer, dan hasil pencarian."
          - label: "Tagline (judul tab & SEO)"
            name: "tagline"
            widget: "string"
            hint: "Teks besar di hero diatur di \"Teks & Terjemahan → Hero\"."
          - label: "Deskripsi situs (SEO)"
            name: "description"
            widget: "text"
            hint: "Tampil di Google & media sosial. Idealnya di bawah 160 karakter."
          - label: "Tautan GitHub"
            name: "github"
            widget: "string"
            pattern: ["^https://","Harus diawali https://"]
          - label: "URL situs"
            name: "url"
            widget: "hidden"
            default: "https://mab-app.eu.org"
  - name: "texts"
    label: "Teks & Terjemahan"
